<style>
  :root {
    --bg: #f6f2eb; --bg-card: #fffaf3; --ink: #1a1612; --ink-soft: #5c544a;
    --accent: #b93f2b; --accent-soft: #f1dfd8; --line: #ded3c4;
    --gold: #b8923a; --green: #4a6b3a; --amber: #c08a2e; --whatsapp: #25d366;
    --card: #fffdf8; --muted-panel: #f9f4ec; --shadow-soft: 0 1px 0 rgba(44, 38, 31, 0.03);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Inter Tight', 'Helvetica Neue', system-ui, sans-serif; }
  .font-display { font-family: 'Fraunces', 'Playfair Display', Georgia, serif; font-weight: 600; letter-spacing: -0.02em; }
  .font-body { font-family: 'Inter Tight', 'Helvetica Neue', system-ui, sans-serif; }
  .app-header { border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #fffaf3 0%, #f6f2eb 100%); }
  .app-header-inner { max-width: 1240px; margin: 0 auto; padding: 1.05rem 2rem 1.35rem; }
  .app-topline { display: flex; flex-direction: column; align-items: stretch; gap: 0.75rem; }
  .app-topline > div:first-child { width: 100%; text-align: center; background: rgba(255, 253, 248, 0.88); border: 1px solid rgba(222, 211, 196, 0.78); border-radius: 8px; padding: 1rem 1.25rem 1.05rem; box-shadow: var(--shadow-soft); }
  .app-brand-panel { position: relative; min-height: 6.7rem; padding-right: 8.8rem !important; padding-left: 8.8rem !important; }
  .app-owner-logo { position: absolute; top: 0.8rem; right: 1rem; width: 7.2rem; max-width: 18vw; height: auto; border-radius: 6px; object-fit: contain; box-shadow: 0 4px 12px rgba(26, 22, 18, 0.14); background: #1a1612; }
  .report-result-icon-preload { position: absolute; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; left: -9999px; top: -9999px; }
  .app-kicker { display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent); font-weight: 650; }
  .app-version-pill { display: inline-flex; align-items: center; min-height: 1.45rem; padding: 0 0.55rem; border-radius: 999px; border: 1px solid var(--line); background: var(--muted-panel); color: var(--ink-soft); letter-spacing: 0; text-transform: none; font-size: 0.68rem; font-weight: 650; }
  .event-title-row { display: flex; align-items: center; justify-content: center; gap: 0.7rem; flex-wrap: wrap; margin-top: 0.25rem; }
  .event-title-row h1 { margin: 0; font-size: 1.85rem; line-height: 1.05; }
  .event-status-badge { display: inline-flex; align-items: center; padding: 0.16rem 0.55rem; border-radius: 999px; background: #eef3e8; border: 1px solid #cad8bd; color: var(--green); font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .event-subline { font-size: 0.9rem; color: var(--ink-soft); margin-top: 0.35rem; }
  .app-toolbar { width: 100%; display: flex; gap: 0.55rem 0.75rem; flex-wrap: wrap; align-items: center; justify-content: space-between; background: rgba(249, 244, 236, 0.96); border: 1px solid rgba(222, 211, 196, 0.82); border-radius: 8px; padding: 0.65rem 0.75rem; box-shadow: var(--shadow-soft); }
  .toolbar-group { display: inline-flex; gap: 0.35rem; align-items: center; flex-wrap: wrap; padding-right: 0.75rem; margin-right: 0.1rem; border-right: 1px solid rgba(217, 207, 193, 0.72); }
  .toolbar-group:last-child { border-right: none; padding-right: 0; margin-right: 0; }
  .tab-nav { margin-top: 0.75rem; display: flex; gap: 0.32rem 0.42rem; flex-wrap: wrap; align-items: center; justify-content: center; background: rgba(255, 253, 248, 0.72); border: 1px solid rgba(222, 211, 196, 0.72); border-radius: 8px; padding: 0.65rem 0.75rem 0.55rem; }
  .tab-btn { padding: 0.54rem 0.88rem; border: 1px solid transparent; background: transparent; color: #574d42; font-size: 0.8rem; font-weight: 560; letter-spacing: 0.025em; cursor: pointer; transition: color 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s; text-transform: uppercase; border-radius: 999px; }
  .tab-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.72); border-color: rgba(222, 211, 196, 0.7); }
  .tab-btn.active { color: #8f2f20; border-color: rgba(185, 63, 43, 0.34); background: #f3dfd7; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.55); font-weight: 720; }
  @media (max-width: 760px) {
    .app-brand-panel { padding-left: 1.25rem !important; padding-right: 1.25rem !important; }
    .app-owner-logo { position: static; display: block; width: 6.2rem; max-width: 42vw; margin: 0.75rem auto 0; }
  }
  .card { background: var(--card) !important; border: 1px solid rgba(217, 207, 193, 0.88); border-left: 0.28rem solid rgba(185, 63, 43, 0.48) !important; border-radius: 7px; padding: 1.35rem; box-shadow: var(--shadow-soft); }
  .input, .select, .textarea { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--line); background: white; border-radius: 3px; font-family: 'Inter Tight', sans-serif; font-size: 0.9rem; color: var(--ink); }
  .input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .label { display: block; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 0.35rem; }
  .btn { padding: 0.55rem 1rem; border-radius: 5px; border: none; font-family: 'Inter Tight', sans-serif; font-size: 0.85rem; font-weight: 560; cursor: pointer; transition: all 0.15s; letter-spacing: 0.01em; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: #a8341f; }
  .btn-ghost { background: rgba(255, 255, 255, 0.54); color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { background: var(--bg); border-color: var(--ink-soft); }
  .btn-danger { background: rgba(255, 255, 255, 0.54); color: var(--accent); border: 1px solid rgba(185, 63, 43, 0.7); }
  .btn-danger:hover { background: var(--accent); color: white; }
  .btn-whatsapp { background: var(--whatsapp); color: white; }
  .btn-whatsapp:hover { background: #1ebe57; }
  .btn-sm { padding: 0.42rem 0.72rem; font-size: 0.78rem; min-height: 2.15rem; display: inline-flex; align-items: center; justify-content: center; }
  .workflow-glass-btn {
    position: relative;
    isolation: isolate;
    min-height: 3rem;
    border-radius: 999px !important;
    border: 1px solid rgba(255,255,255,0.58) !important;
    background:
      radial-gradient(circle at 26% 18%, rgba(255,255,255,0.92), rgba(255,255,255,0.18) 28%, transparent 42%),
      linear-gradient(145deg, rgba(255,255,255,0.46) 0%, rgba(255,255,255,0.15) 34%, rgba(155,104,255,0.22) 64%, rgba(185,63,43,0.94) 100%),
      linear-gradient(180deg, #d75035 0%, #b93f2b 60%, #8d2b1d 100%) !important;
    color: #fffaf3 !important;
    text-shadow: 0 1px 1px rgba(44, 22, 18, 0.45), 0 0 12px rgba(196, 160, 255, 0.36);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.9),
      inset 0 -12px 18px rgba(78,28,20,0.26),
      0 9px 0 #7d281b,
      0 16px 28px rgba(67,48,28,0.22);
    overflow: hidden;
    transform: translateY(0);
    transition: transform 140ms ease, box-shadow 140ms ease, filter 140ms ease;
  }
  .workflow-glass-btn::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: 3px 8px auto 8px;
    height: 45%;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.08));
    pointer-events: none;
  }
  .workflow-glass-btn::after {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -26% auto auto -10%;
    width: 56%;
    height: 95%;
    border-radius: 999px;
    background: radial-gradient(circle, rgba(212,184,255,0.48), transparent 68%);
    transform: rotate(-16deg);
    pointer-events: none;
  }
  .workflow-glass-btn:hover {
    filter: saturate(1.08) brightness(1.04);
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.94),
      inset 0 -12px 18px rgba(78,28,20,0.24),
      0 11px 0 #7d281b,
      0 20px 34px rgba(67,48,28,0.24);
  }
  .workflow-glass-btn:active {
    transform: translateY(6px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.78),
      inset 0 -8px 12px rgba(78,28,20,0.24),
      0 3px 0 #7d281b,
      0 8px 16px rgba(67,48,28,0.18);
  }
  .workflow-glass-btn.workflow-glass-green {
    background:
      radial-gradient(circle at 26% 18%, rgba(255,255,255,0.96), rgba(255,255,255,0.23) 30%, transparent 45%),
      linear-gradient(145deg, rgba(255,255,255,0.54) 0%, rgba(255,255,255,0.2) 35%, rgba(206,255,190,0.36) 64%, rgba(74,107,58,0.96) 100%),
      linear-gradient(180deg, #7fa85f 0%, #4a6b3a 62%, #314d24 100%) !important;
    text-shadow: 0 1px 1px rgba(21, 48, 18, 0.48), 0 0 13px rgba(210, 255, 190, 0.42);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.94),
      inset 0 -12px 18px rgba(29,72,24,0.24),
      0 9px 0 #2f481f,
      0 16px 28px rgba(43,73,34,0.24);
  }
  .workflow-glass-btn.workflow-glass-green:hover {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.96),
      inset 0 -12px 18px rgba(29,72,24,0.22),
      0 11px 0 #2f481f,
      0 20px 34px rgba(43,73,34,0.26);
  }
  .workflow-glass-btn.workflow-glass-green:active {
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.82),
      inset 0 -8px 12px rgba(29,72,24,0.22),
      0 3px 0 #2f481f,
      0 8px 16px rgba(43,73,34,0.18);
  }
  .workflow-glass-btn.btn-sm { min-height: 2.75rem; padding-left: 1rem; padding-right: 1rem; font-weight: 850; }
  .badge { display: inline-block; padding: 0.2rem 0.6rem; font-size: 0.7rem; font-weight: 600; border-radius: 2px; letter-spacing: 0.04em; text-transform: uppercase; }
  .badge-open { background: #ede4d3; color: var(--ink-soft); }
  .badge-bezig { background: #f4e4c5; color: var(--amber); }
  .badge-ok { background: #dde7d3; color: var(--green); }
  .badge-pasok { background: var(--accent-soft); color: var(--accent); }
  .stat-num { font-family: 'Fraunces', serif; font-size: 2.25rem; font-weight: 600; color: var(--ink); line-height: 1; letter-spacing: -0.02em; }
  .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--ink-soft); margin-top: 0.42rem; font-weight: 600; }
  .alert-bar { padding: 0.85rem 1.1rem; border-radius: 7px; margin-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; border: 1px solid rgba(217, 207, 193, 0.7); }
  .alert-amber { background: #fbf0dc; border-left: 3px solid rgba(192, 138, 46, 0.76); }
  .alert-red { background: #f6e6df; border-left: 3px solid rgba(185, 63, 43, 0.78); }
  .alert-green { background: #eef4e8; border-left: 3px solid rgba(74, 107, 58, 0.72); }
  .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.9rem; margin-bottom: 1.5rem; }
  .dashboard-card { min-height: 112px; }
  .dashboard-section { margin-bottom: 1.35rem; }
  .weather-card { margin-bottom: 1.25rem; background: linear-gradient(135deg, #f8fbfc 0%, #fffaf3 100%) !important; border-left-color: rgba(74, 107, 58, 0.38) !important; }
  .quick-nav-card h2 { margin-top: 0; margin-bottom: 1rem; font-size: 1.22rem; }
  .pill { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.6rem; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; font-size: 0.78rem; color: var(--ink); margin: 0.15rem; cursor: pointer; }
  .pill.active { background: var(--accent); color: white; border-color: var(--accent); }
  .pill.warn { border-color: var(--amber); background: #fdf6e3; }
  a.link { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a.link:hover { color: #a8341f; }
  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  .chevron { display: inline-block; transition: transform 0.2s; }
  details[open] .chevron { transform: rotate(90deg); }
  .grid-2 { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } }
  .switch { display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; }
  .switch-track { width: 36px; height: 20px; background: var(--line); border-radius: 999px; position: relative; transition: background 0.2s; }
  .switch-track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: white; border-radius: 50%; transition: transform 0.2s; }
  .switch.on .switch-track { background: var(--accent); }
  .switch.on .switch-track::after { transform: translateX(16px); }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--ink); color: white; padding: 0.7rem 1.2rem; border-radius: 4px; font-size: 0.85rem; z-index: 1000; }
  .dict-row { display: grid; grid-template-columns: 1fr 1fr auto; gap: 0.5rem; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--line); }
  .dict-row:last-child { border-bottom: none; }
  .dictionary-shell { display: grid; gap: 1rem; }
  .dictionary-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: center; }
  .dictionary-title { margin: 0; font-size: 1.45rem; line-height: 1.1; }
  .dictionary-intro { color: var(--ink-soft); font-size: 0.9rem; line-height: 1.55; margin: 0.65rem 0 0; max-width: 820px; }
  .dictionary-count { min-width: 92px; text-align: center; padding: 0.75rem 0.9rem; border: 1px solid var(--line); border-radius: 7px; background: rgba(255, 255, 255, 0.58); }
  .dictionary-count strong { display: block; font-family: 'Fraunces', serif; font-size: 1.6rem; line-height: 1; }
  .dictionary-toolbar { display: grid; grid-template-columns: minmax(260px, 1fr) auto; gap: 0.8rem; align-items: center; }
  .dictionary-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 0.75rem; align-items: end; }
  .dictionary-table { padding: 0; overflow: hidden; }
  .dictionary-table-head, .dictionary-row { display: grid; grid-template-columns: minmax(180px, 0.9fr) minmax(220px, 1fr) minmax(170px, auto); gap: 0.85rem; align-items: center; }
  .dictionary-table-head { padding: 0.75rem 1rem; background: rgba(249, 244, 236, 0.86); border-bottom: 1px solid var(--line); color: var(--ink-soft); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
  .dictionary-row { padding: 0.72rem 1rem; border-bottom: 1px solid rgba(217, 207, 193, 0.7); background: rgba(255, 253, 248, 0.72); }
  .dictionary-row:last-child { border-bottom: none; }
  .dictionary-row:hover { background: rgba(255, 255, 255, 0.86); }
  .dictionary-term { min-width: 0; font-weight: 650; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dictionary-language-label { display: inline-flex; align-items: center; gap: 0.35rem; }
  .dictionary-actions { display: flex; justify-content: flex-end; align-items: center; gap: 0.35rem; }
  .dictionary-empty { color: var(--ink-soft); text-align: center; margin: 0; padding: 1.5rem; }
  .dictionary-book-wrap { position: relative; padding: 1rem; border-radius: 10px; background: linear-gradient(135deg, rgba(122, 96, 62, 0.11), rgba(255, 253, 248, 0.15)); }
  .dictionary-book { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0; min-height: 520px; border-radius: 10px; box-shadow: 0 18px 42px rgba(44, 38, 31, 0.16); overflow: hidden; background: #f2e5cc; }
  .dictionary-book::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2.2rem; transform: translateX(-50%); background: linear-gradient(90deg, rgba(85, 61, 35, 0.2), rgba(255,255,255,0.36) 45%, rgba(85,61,35,0.18)); pointer-events: none; z-index: 2; }
  .dictionary-page { position: relative; padding: 1.35rem 1.55rem 1.55rem; background: linear-gradient(135deg, #fffdf6 0%, #f8efd9 100%); min-width: 0; }
  .dictionary-page-left { border-right: 1px solid rgba(154, 128, 91, 0.22); padding-right: 2.1rem; }
  .dictionary-page-right { border-left: 1px solid rgba(255, 255, 255, 0.72); padding-left: 2.1rem; }
  .dictionary-page::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.45), transparent 28%), linear-gradient(90deg, rgba(122,96,62,0.04), transparent 18%, transparent 82%, rgba(122,96,62,0.05)); pointer-events: none; }
  .dictionary-page-title { position: relative; z-index: 1; margin: 0 0 1rem; padding-bottom: 0.45rem; border-bottom: 1px solid rgba(154, 128, 91, 0.28); color: rgba(92, 76, 52, 0.72); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 760; }
  .dictionary-letter-section { position: relative; z-index: 1; break-inside: avoid; margin-bottom: 1.05rem; }
  .dictionary-letter { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.45rem; font-family: 'Fraunces', Georgia, serif; font-size: 1.38rem; line-height: 1; color: #7b3a2c; }
  .dictionary-letter::after { content: ""; height: 1px; flex: 1; background: rgba(154, 128, 91, 0.26); }
  .dictionary-book-entry { display: grid; grid-template-columns: minmax(110px, 0.86fr) minmax(130px, 1fr) auto; gap: 0.65rem; align-items: center; min-height: 2.35rem; padding: 0.18rem 0; border-bottom: 1px dotted rgba(154, 128, 91, 0.24); }
  .dictionary-book-entry:last-child { border-bottom: none; }
  .dictionary-book-term { min-width: 0; color: var(--ink); font-weight: 720; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dictionary-book-entry .input { min-height: 2rem; padding: 0.32rem 0.48rem; background: rgba(255,255,255,0.64); border-color: rgba(154, 128, 91, 0.32); }
  .dictionary-book-actions { display: flex; justify-content: flex-end; }
  .dictionary-book-actions .btn { width: 30px; height: 30px; min-height: 30px; min-width: 30px; padding: 0; border-radius: 999px; opacity: 0.72; }
  .dictionary-book-entry:hover .dictionary-book-actions .btn { opacity: 1; }
  @media (max-width: 980px) {
    .dictionary-hero, .dictionary-toolbar, .dictionary-form, .dictionary-table-head, .dictionary-row { grid-template-columns: 1fr; }
    .dictionary-count { text-align: left; }
    .dictionary-actions { justify-content: flex-start; }
    .dictionary-table-head { display: none; }
    .dictionary-book { grid-template-columns: 1fr; }
    .dictionary-book::before { display: none; }
    .dictionary-page-left, .dictionary-page-right { padding: 1.25rem; border: none; }
  }
  .lang-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .lang-toggle button { background: transparent; border: none; padding: 0.4rem 0.7rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
  .lang-toggle button.active { background: var(--accent); color: white; }
  .send-row { display: grid; grid-template-columns: auto 1fr auto auto; gap: 0.7rem; align-items: center; padding: 0.6rem 0.8rem; border: 1px solid var(--line); background: white; border-radius: 3px; margin-bottom: 0.4rem; }
  .send-row.sent-today { background: #dde7d3; border-color: var(--green); }
  .send-row.sent-week { background: #f4e4c5; border-color: var(--amber); }
  .info-box { background: #fdf6e3; border-left: 3px solid var(--gold); padding: 0.8rem 1rem; border-radius: 3px; font-size: 0.85rem; margin: 1rem 0; color: var(--ink); }
  .volunteer-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.8rem; margin-bottom: 1rem; }

let eventToolGDriveSilentAuth = false;

const eventToolGDriveListeners = new Set();

function eventToolGDriveEmit() {
  eventToolGDriveListeners.forEach(listener => {
    try {
      listener(eventToolGDriveSnapshot());
    } catch (e) {
      console.warn("Google Drive listener error:", e);
    }

function eventToolGDriveSubscribe(listener) {
  eventToolGDriveListeners.add(listener);
  listener(eventToolGDriveSnapshot());
  return () => eventToolGDriveListeners.delete(listener);

  if (!eventToolGDriveAccessToken || eventToolGDriveAccessToken === "null" || eventToolGDriveAccessToken === "") return false;

  return Date.now() < eventToolGDriveTokenExpiry - 60000;
}

function eventToolGDriveWantsConnection() {
  return localStorage.getItem("eventtool_gdrive_auto_connect") === "1" || !!localStorage.getItem("eventtool_gdrive_user_name");
}

function eventToolGDriveSnapshot() {
  return {
    ready: !!eventToolGDriveTokenClient,
    connected: eventToolGDriveIsTokenValid(),
    wantsConnection: eventToolGDriveWantsConnection(),

    eventToolGDriveTokenExpiry = storedExpiry;

    eventToolGDriveSilentAuth = false;

  if (!eventToolGDriveIsTokenValid()) return;
  try {

    localStorage.setItem("eventtool_gdrive_user_name", eventToolGDriveUserName);
  } catch (e) {

  }

    });
    eventToolGDriveEmit();
    return true;
  } catch (e) {
    const msg = e && e.message ? e.message : String(e);
    localStorage.setItem("eventtool_gdrive_last_error", msg);
    eventToolGDriveEmit();
    alert(`Google Drive verbinden mislukt: ${msg}`);
    return false;
  }
}

function eventToolGDriveReconnect() {
  eventToolGDriveAccessToken = null;
  eventToolGDriveTokenExpiry = 0;
  return eventToolGDriveConnect();
}

function eventToolGDriveDisconnect() {
  eventToolGDriveAccessToken = null;
  eventToolGDriveTokenExpiry = 0;
  eventToolGDriveUserName = null;
  ["eventtool_gdrive_token", "eventtool_gdrive_token_expiry", "eventtool_gdrive_user_name", "eventtool_gdrive_auto_connect", "eventtool_gdrive_file_id", "eventtool_gdrive_last_error"].forEach(key => localStorage.removeItem(key));
  eventToolGDriveEmit();
}

function eventToolGDriveEscapeQueryValue(value) {
  return String(value || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
}

async function eventToolGDriveSearchFile(fileName, parentId = EVENT_TOOL_SYNC_FOLDER_ID) {
  const q = `name='${eventToolGDriveEscapeQueryValue(fileName)}' and '${parentId}' in parents and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&fields=files(id,name,modifiedTime,size)`;
  const r = await fetch(url, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  if (!r.ok) throw new Error(`Drive search failed: ${r.status}`);
  const data = await r.json();
  return data.files || [];
}

async function eventToolGDriveEnsureFolder(folderName, parentId = EVENT_TOOL_SYNC_FOLDER_ID) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const q = `name='${eventToolGDriveEscapeQueryValue(folderName)}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const listUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&fields=files(id,name,webViewLink)`;
  const listResponse = await fetch(listUrl, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  if (!listResponse.ok) throw new Error(`Drive folder search failed: ${listResponse.status}`);
  const listData = await listResponse.json();
  if (listData.files && listData.files.length) return listData.files[0];
  const createResponse = await fetch("https://www.googleapis.com/drive/v3/files?fields=id,name,webViewLink", {
    method: "POST",
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      name: folderName,
      mimeType: "application/vnd.google-apps.folder",
      parents: [parentId]
    })
  });
  if (!createResponse.ok) throw new Error(`Drive folder create failed: ${createResponse.status}`);
  return await createResponse.json();
}

async function eventToolGDriveFindFolder(folderName, parentId = EVENT_TOOL_SYNC_FOLDER_ID) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const q = `name='${eventToolGDriveEscapeQueryValue(folderName)}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&fields=files(id,name,webViewLink)`;
  const response = await fetch(url, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  if (!response.ok) throw new Error(`Drive folder search failed: ${response.status}`);
  const data = await response.json();
  return data.files && data.files.length ? data.files[0] : null;
}

async function eventToolGDriveListFilesInFolder(parentId) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const q = `'${parentId}' in parents and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&orderBy=modifiedTime desc&fields=files(id,name,mimeType,modifiedTime,size,webViewLink)`;
  const response = await fetch(url, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  if (!response.ok) throw new Error(`Drive folder list failed: ${response.status}`);
  const data = await response.json();
  return data.files || [];
}

async function eventToolGDriveListFilesByPrefix(prefix) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const q = `name contains '${eventToolGDriveEscapeQueryValue(prefix)}' and '${EVENT_TOOL_SYNC_FOLDER_ID}' in parents and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&spaces=drive&orderBy=modifiedTime desc&fields=files(id,name,modifiedTime,size)`;
  const r = await fetch(url, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  if (!r.ok) throw new Error(`Drive list failed: ${r.status}`);
  const data = await r.json();
  return (data.files || []).filter(file => (file.name || "").startsWith(prefix));
}

async function eventToolGDriveDownloadJsonById(fileId) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  if (!r.ok) throw new Error(`Drive download failed: ${r.status}`);
  return await r.json();
}

async function eventToolGDriveUploadJson(fileName, payload, parentId = EVENT_TOOL_SYNC_FOLDER_ID) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const existing = await eventToolGDriveSearchFile(fileName, parentId);
  for (const file of existing) {
    try {
      await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}`, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${eventToolGDriveAccessToken}`
        }
      });
    } catch (e) {
      console.warn("Drive delete failed:", e);
    }
  }
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify({
    name: fileName,
    parents: [parentId]
  })], {
    type: "application/json"
  }));
  form.append("file", new Blob([JSON.stringify(payload, null, 2)], {
    type: "application/json"
  }));
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
    method: "POST",
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    },
    body: form
  });
  if (!r.ok) throw new Error(`Drive upload failed: ${r.status}`);
  return await r.json();
}

function eventToolGDriveEventFolderNameFromPayload(payload, fallbackEvent = {}) {
  const payloadEvent = payload && payload.event || {};
  const parts = [
    payloadEvent.name || fallbackEvent.naam || fallbackEvent.name || "evenement",
    payloadEvent.date || fallbackEvent.datum || fallbackEvent.date || "",
    payloadEvent.location || payloadEvent.city || fallbackEvent.gemeente || fallbackEvent.locatieNaam || ""
  ].filter(Boolean);
  return parts.join("_").replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "") || "evenement";
}

async function eventToolGDriveArchiveKassaExport(fileName, payload, fallbackEvent = {}) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const eventFolder = await eventToolGDriveEnsureFolder(eventToolGDriveEventFolderNameFromPayload(payload, fallbackEvent));
  const exportFolder = await eventToolGDriveEnsureFolder("02-kassa-exports", eventFolder.id);
  return await eventToolGDriveUploadJson(fileName, payload, exportFolder.id);
}

async function eventToolGDriveUploadBlob(fileName, blob, mimeType, parentId = EVENT_TOOL_SYNC_FOLDER_ID) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const existing = await eventToolGDriveSearchFile(fileName, parentId);
  for (const file of existing) {
    try {
      await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}`, {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${eventToolGDriveAccessToken}`
        }
      });
    } catch (e) {
      console.warn("Drive file delete failed:", e);
    }
  }
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify({
    name: fileName,
    parents: [parentId]
  })], {
    type: "application/json"
  }));
  form.append("file", blob, fileName);
  const r = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink,webContentLink", {
    method: "POST",
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    },
    body: form
  });
  if (!r.ok) throw new Error(`Drive file upload failed: ${r.status}`);
  const file = await r.json();
  const permissionResponse = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}/permissions`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${eventToolGDriveAccessToken}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        role: "reader",
        type: "anyone"
      })
    });
  if (!permissionResponse.ok) throw new Error(`Drive share failed: ${permissionResponse.status}`);
  const meta = await fetch(`https://www.googleapis.com/drive/v3/files/${file.id}?fields=id,name,webViewLink,webContentLink`, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  return meta.ok ? await meta.json() : file;
}

async function eventToolGDriveDownloadJson(fileName) {
  if (!eventToolGDriveIsTokenValid()) throw new Error("Google Drive is niet verbonden.");
  const files = await eventToolGDriveSearchFile(fileName);
  if (!files.length) throw new Error(`Bestand niet gevonden: ${fileName}`);
  const r = await fetch(`https://www.googleapis.com/drive/v3/files/${files[0].id}?alt=media`, {
    headers: {
      Authorization: `Bearer ${eventToolGDriveAccessToken}`
    }
  });
  if (!r.ok) throw new Error(`Drive download failed: ${r.status}`);
  return await r.json();
}

async function eventToolGDriveRunConnectionTest(data) {
  const payload = {
    schemaName: "be.zomerfeest.eventtool-drive-test",
    schemaVersion: "1.0.0",
    app: "Hoofdapp",
    appVersion: APP_VERSION,
    folderId: EVENT_TOOL_SYNC_FOLDER_ID,
    eventId: data && data.activeEventId || data && data.event && data.event.id || "",
    eventName: data && data.event && data.event.naam || "",
    createdAt: new Date().toISOString()
  };
  await eventToolGDriveUploadJson(EVENT_TOOL_DRIVE_TEST_FILE_NAME, payload);
  const readBack = await eventToolGDriveDownloadJson(EVENT_TOOL_DRIVE_TEST_FILE_NAME);
  if (!readBack || readBack.schemaName !== payload.schemaName) {
    throw new Error("Drive testbestand kon niet correct gelezen worden.");
  }
  localStorage.setItem("eventtool_gdrive_last_test", String(Date.now()));
  localStorage.removeItem("eventtool_gdrive_last_error");
  eventToolGDriveEmit();
  return readBack;
}

const buildReverseDict = dict => {
  const rev = {};
  Object.entries(dict).forEach(([nl, fr]) => {
    rev[fr.toLowerCase()] = nl;
  });
  return rev;
};
const matchCase = (original, translated) => {
  if (!original) return translated;
  if (original[0] === original[0].toUpperCase()) {
    return translated.charAt(0).toUpperCase() + translated.slice(1);
  }
  return translated;
};

// Forceer lowercase voor opslag (gebruikt voor materiaal-, taak-, woordenboek-namen)
const normalizeName = s => (s || "").toString().trim().toLowerCase();

const syncMaterialsToDictionary = (woordenboek = {}, materiaal = []) => {
  const next = {
    ...(woordenboek || {})
  };
  (materiaal || []).forEach(item => {
    const term = normalizeName(item && item.naamNl || "");
    const translation = normalizeName(item && item.naamFr || "");
    if (!term) return;
    if (!Object.prototype.hasOwnProperty.call(next, term)) {
      next[term] = translation;
    } else if (!next[term] && translation) {
      next[term] = translation;
    }
  });
  return next;
};

// Aanspreeknaam voor sjablonen: roepnaam indien ingevuld, anders voornaam
const aanspreeknaam = v => v && v.roepnaam && v.roepnaam.trim() ? v.roepnaam.trim() : v && v.voornaam || "";

// Eerste letter hoofdletter voor weergave
const capitalize = s => {
  if (!s) return "";
  const str = s.toString();
  return str.charAt(0).toUpperCase() + str.slice(1);
};
const translateText = (text, from, to, dict) => {
  if (!text) return "";
  const lower = text.trim().toLowerCase();
  const lookup = from === "nl" ? dict : buildReverseDict(dict);
  if (lookup[lower]) return matchCase(text, lookup[lower]);
  const tokens = text.split(/(\s+|[,;.])/);
  let foundAny = false;
  const translated = tokens.map(tok => {
    if (!tok.trim() || /^[\s,;.]+$/.test(tok)) return tok;
    const lt = tok.toLowerCase();
    if (lookup[lt]) {
      foundAny = true;
      return matchCase(tok, lookup[lt]);
    }
    return tok;
  }).join("");
  return foundAny ? translated : "";
};

// Vaste oorsprong-waarde die de winkel-flow activeert
const WINKEL_OORSPRONG = "Winkel_Magasin";

// Parse een bedrag-string (komma of punt) naar getal
const parseBedragNum = v => {
  const n = parseFloat(String(v == null ? "" : v).replace(",", "."));
  return isNaN(n) ? 0 : n;
};
// Bedrag formatteren als "€ 12,34"
const fmtEuro = n => `€ ${(Number(n) || 0).toFixed(2).replace(".", ",")}`;

// Bereken de kostensamenvatting van het huidige evenement
function berekenKosten(data) {
  const kb = data.kostenbeheer || {
    budget: "",
    zaalhuur: "",
    manueleKosten: [],
    kasStart: "",
    kasBewegingen: []
  };
  const budget = parseBedragNum(kb.budget);
  const zaalhuur = parseBedragNum(kb.zaalhuur);

  // 🔧 KRITIEKE FIX: bepaal exact welke kasticket-sleutels actief zijn in Winkelbestellingen.
  // Niet alleen filteren op winkelId, want oude/wees-kastickets van dezelfde winkel
  // (bv. w_colruyt|__geen__|__geen__) mogen niet meetellen in Kostenbeheer.
  const kasticketKeyKosten = (best, winkelId) => {
    const wk = winkelId || "__geen__";
    const ak = best && best.aankoperId === "__extern__"
      ? `ext:${(best.aankoperVrij || "").trim().toLowerCase()}`
      : (best && best.aankoperId) || "__geen__";
    const dt = best && best.datum ? best.datum : "__geen__";
    return `${wk}|${ak}|${dt}`;
  };
  const actieveKasticketKeys = new Set();
  (data.materiaal || []).forEach(mat => {
    if (
      mat &&
      mat.oorsprong === WINKEL_OORSPRONG &&
      mat.winkelId &&
      mat.winkelId.trim() !== ""
    ) {
      const best = (data.winkelbestellingen || {})[mat.id] || {};
      actieveKasticketKeys.add(kasticketKeyKosten(best, mat.winkelId));
    }
  });

  // Winkeltotalen: som van de actieve kasticketbedragen per winkel.
  const winkelPerNaam = {};
  const kastickets = data.kastickets || {};
  let winkelUitKasTotaal = 0;
  const winkelUitKas = [];
  Object.keys(kastickets).forEach(key => {
    // 🔧 FILTER: alleen kastickets die exact overeenkomen met actuele Winkelbestellingen.
    if (!actieveKasticketKeys.has(key)) return;

    const kt = kastickets[key];
    const bedrag = parseBedragNum(kt.bedrag);
    if (bedrag === 0) return;
    const winkelId = key.split("|")[0];

    const w = (data.winkels || []).find(x => x.id === winkelId);
    const naam = w ? w.naam : "—";
    if (kt.uitKas) {
      winkelUitKasTotaal += bedrag;
      winkelUitKas.push({winkel: naam, bedrag});
    } else {
      winkelPerNaam[naam] = (winkelPerNaam[naam] || 0) + bedrag;
    }
  });
  const winkelTotaal = Object.values(winkelPerNaam).reduce((a, b) => a + b, 0);

  // Manuele kosten
  const manueelTotaal = (kb.manueleKosten || []).reduce((a, k) => a + parseBedragNum(k.bedrag), 0);

  // Voorverkoop-inkomsten
  const voorverkoopTotaal = (data.voorverkopen || []).reduce((a, v) => a + parseBedragNum(v.bedrag), 0);

  // Zelfinbreng-inkomsten
  const zelfinbrengTotaal = (data.zelfinbreng || []).reduce((a, z) => a + parseBedragNum(z.bedrag), 0);

  // Streefdoel voorverkoop + restant
  const voorverkoopStreefdoel = parseBedragNum(data.voorverkoopStreefdoel);
  const voorverkoopRestant = voorverkoopStreefdoel - voorverkoopTotaal;

  // Budget: zaalhuur + winkelkosten (niet uit kas) + manuele kosten
  const totaalUitgegeven = zaalhuur + winkelTotaal + manueelTotaal;
  // Saldo: budget + voorverkoop + zelfinbreng - uitgaven
  const totaleInkomsten = budget + voorverkoopTotaal + zelfinbrengTotaal;
  const saldo = totaleInkomsten - totaalUitgegeven;

  // --- Kasberekening (apart van het budget) ---
  const kasStart = parseBedragNum(kb.kasStart);
  let kasIn = 0,
    kasUit = 0;
  (kb.kasBewegingen || []).forEach(b => {
    const bed = parseBedragNum(b.bedrag);
    if (b.type === "uit") kasUit += bed;else kasIn += bed;
  });
  // Uit-kas-betaalde winkelaankopen tellen ook als kasuitgave
  const kasUitTotaal = kasUit + winkelUitKasTotaal;
  const kasEind = kasStart + kasIn - kasUitTotaal;
  return {
    budget,
    zaalhuur,
    winkelPerNaam,
    winkelTotaal,
    manueelTotaal,
    totaalUitgegeven,
    saldo,
    voorverkoopTotaal,
    zelfinbrengTotaal,
    totaleInkomsten,
    voorverkoopStreefdoel,
    voorverkoopRestant,
    kasStart,
    kasIn,
    kasUitBewegingen: kasUit,
    winkelUitKas,
    winkelUitKasTotaal,
    kasUitTotaal,
    kasEind
  };
}

function berekenEindafrekening(data) {
  const kosten = berekenKosten(data || {});
  const activeEventId = data && data.activeEventId || data && data.event && data.event.id || "";
  const activeEventRecord = data && Array.isArray(data.events) ? data.events.find(event => event && event.id === activeEventId) : null;
  const activeEventCandidates = [data && data.event || {}, activeEventRecord || {}, activeEventRecord && activeEventRecord.eventInfo || {}, activeEventRecord && activeEventRecord.snapshot && activeEventRecord.snapshot.eventInfo || {}].filter(Boolean);
  const importBatches = data && data.kassaImports && Array.isArray(data.kassaImports.batches) ? data.kassaImports.batches : [];
  const batchMatchesCurrentEvent = batch => {
    if (!batch) return false;
    if (!activeEventId) return true;
    if (batch.eventId && batch.eventId === activeEventId) return true;
    const batchName = normalizeKassaEventName(batch.eventName || "");
    const batchDate = normalizeKassaEventDate(batch.eventDate || "");
    return activeEventCandidates.some(candidate => {
      const activeName = normalizeKassaEventName(getKassaEventNameCandidate(candidate));
      const activeDate = normalizeKassaEventDate(getKassaEventDateCandidate(candidate));
      return !!activeName && !!batchName && activeName === batchName && !!activeDate && !!batchDate && activeDate === batchDate;
    });
  };
  const currentBatchIds = new Set(importBatches.filter(batchMatchesCurrentEvent).map(batch => batch.id).filter(Boolean));
  const isCurrentEvent = item => {
    if (!activeEventId) return true;
    if (!item) return false;
    if (item.eventId && item.eventId === activeEventId) return true;
    const linkedBatchId = item.sourceBatchId || item.batchId || "";
    if (linkedBatchId && currentBatchIds.has(linkedBatchId)) return true;
    return !item.eventId && !linkedBatchId;
  };
  const ledgerRows = data && data.finance && Array.isArray(data.finance.ledgerTransactions) ? data.finance.ledgerTransactions.filter(row => row && row.source === "kassa-import" && isCurrentEvent(row)) : [];
  const ledgerRowIds = new Set(ledgerRows.map(row => row && row.id).filter(Boolean));
  const corrections = data && data.finance && Array.isArray(data.finance.corrections) ? data.finance.corrections.filter(item => item && item.source === "kassa-ledger-correction" && (isCurrentEvent(item) || item.sourceLedgerTransactionId && ledgerRowIds.has(item.sourceLedgerTransactionId))) : [];
  const sumRows = (rows, type) => rows.filter(row => row.type === type && !row.auditOnly).reduce((sum, row) => sum + getKassaPreviewCents(row.amountCents), 0);
  const sumCorrections = type => corrections.filter(item => item.type === type).reduce((sum, item) => sum + getKassaPreviewCents(item.amountCents), 0);
  const salesCents = sumRows(ledgerRows, "sales") + sumCorrections("sales");
  const donationsCents = sumRows(ledgerRows, "donations") + sumCorrections("donations");
  const cashCents = sumRows(ledgerRows, "cash") + sumCorrections("cash");
  const cardCents = sumRows(ledgerRows, "card") + sumCorrections("card");
  const payconiqCents = sumRows(ledgerRows, "payconiq") + sumCorrections("payconiq");
  const revenueCorrectionsCents = sumCorrections("sales") + sumCorrections("donations");
  const paymentCents = cashCents + cardCents + payconiqCents;
  const kassaNetCents = salesCents + donationsCents;
  const voorverkoopCents = Math.round((kosten.voorverkoopTotaal || 0) * 100);
  const otherIncomeCents = Math.round((kosten.zelfinbrengTotaal || 0) * 100);
  const roomCents = Math.round((kosten.zaalhuur || 0) * 100);
  const shopCents = Math.round((kosten.winkelTotaal || 0) * 100);
  const manualCents = Math.round((kosten.manueelTotaal || 0) * 100);
  const totalRevenueCents = kassaNetCents + voorverkoopCents + otherIncomeCents;
  const totalCostsCents = roomCents + shopCents + manualCents;
  const resultCents = totalRevenueCents - totalCostsCents;
  const budgetCents = Math.round((kosten.budget || 0) * 100);
  const budgetAfterCostsCents = budgetCents - totalCostsCents;
  const facts = data && data.kassaImports && Array.isArray(data.kassaImports.importedFacts) ? data.kassaImports.importedFacts.filter(item => item && isCurrentEvent(item)) : [];
  const ticketCounts = facts.reduce((acc, fact) => {
    (fact.tickets || []).forEach(ticket => {
      const qty = parseInt(ticket.quantity, 10) || 0;
      if (ticket.type === "manifiesta") acc.manifesta += qty;else if (ticket.type === "external") acc.external += qty;
    });
    return acc;
  }, {
    manifesta: 0,
    external: 0
  });
  const ticketMap = new Map();
  facts.forEach(fact => {
    (fact.tickets || []).forEach(ticket => {
      const qty = parseInt(ticket.quantity, 10) || 0;
      if (!qty) return;
      const type = ticket.type === "manifiesta" ? "manifiesta" : "external";
      const eventName = type === "manifiesta" ? "ManiFiesta" : ticket.eventName || "";
      const eventDate = ticket.eventDate || "";
      const key = `${type}|${eventName}|${eventDate}`;
      const current = ticketMap.get(key) || {
        type,
        eventName,
        eventDate,
        quantity: 0
      };
      current.quantity += qty;
      ticketMap.set(key, current);
    });
  });
  const ticketDetails = Array.from(ticketMap.values()).sort((a, b) => `${a.type}${a.eventName}${a.eventDate}`.localeCompare(`${b.type}${b.eventName}${b.eventDate}`));
  const bookMap = new Map();
  facts.forEach(fact => {
    (fact.bookSales || []).forEach(book => {
      const qty = parseInt(book.quantity, 10) || 0;
      const title = String(book.title || "").trim() || "Boek";
      const unitPriceCents = getKassaPreviewCents(book.unitPriceCents);
      const key = `${title}|${unitPriceCents}`;
      const current = bookMap.get(key) || {
        title,
        unitPriceCents,
        quantity: 0,
        registrations: 0,
        bookTotalCents: 0,
        receivedCents: 0,
        surplusCents: 0,
        donationCents: 0,
        regularizationCents: 0
      };
      current.quantity += qty;
      current.registrations += 1;
      current.bookTotalCents += getKassaPreviewCents(book.bookTotalCents);
      current.receivedCents += getKassaPreviewCents(book.receivedCents);
      current.surplusCents += getKassaPreviewCents(book.surplusCents);
      current.donationCents += getKassaPreviewCents(book.donationCents);
      current.regularizationCents += getKassaPreviewCents(book.regularizationCents);
      bookMap.set(key, current);
    });
  });
  const bookSummary = Array.from(bookMap.values()).sort((a, b) => a.title.localeCompare(b.title, "nl", {
    sensitivity: "base"
  }));
  const bookTotals = bookSummary.reduce((acc, item) => ({
    quantity: acc.quantity + item.quantity,
    registrations: acc.registrations + item.registrations,
    bookTotalCents: acc.bookTotalCents + item.bookTotalCents,
    receivedCents: acc.receivedCents + item.receivedCents,
    surplusCents: acc.surplusCents + item.surplusCents,
    donationCents: acc.donationCents + item.donationCents,
    regularizationCents: acc.regularizationCents + item.regularizationCents
  }), {
    quantity: 0,
    registrations: 0,
    bookTotalCents: 0,
    receivedCents: 0,
    surplusCents: 0,
    donationCents: 0,
    regularizationCents: 0
  });
  return {
    ledgerRows,
    corrections,
    salesCents,
    donationsCents,
    revenueCorrectionsCents,
    cashCents,
    cardCents,
    payconiqCents,
    paymentCents,
    kassaNetCents,
    paymentDifferenceCents: kassaNetCents - paymentCents,
    voorverkoopCents,
    otherIncomeCents,
    totalRevenueCents,
    roomCents,
    shopCents,
    manualCents,
    totalCostsCents,
    resultCents,
    budgetCents,
    budgetAfterCostsCents,
    ticketCounts,
    ticketDetails,
    bookSummary,
    bookTotals
  };
}

const daysUntil = iso => {

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const target = new Date(iso);
  target.setHours(0, 0, 0, 0);
  return Math.round((target - today) / (1000 * 60 * 60 * 24));
};
const isAvailable = (v, item) => {
  if (!v || !item) return true;
  const av = v.beschikbaarheid;
  if (!av || av === "hele_dag") return true;
  if (!item.start || !item.eind) return true;
  const startH = parseInt(item.start.split(":")[0], 10);
  const eindH = parseInt(item.eind.split(":")[0], 10);
  if (av === "voormiddag") return eindH <= 12;
  if (av === "namiddag") return startH >= 12 && eindH <= 18;
  if (av === "avond") return startH >= 17;
  if (av === "aangepast") {
    if (!v.beschikbaarVan || !v.beschikbaarTot) return true;
    return item.start >= v.beschikbaarVan && item.eind <= v.beschikbaarTot;
  }
  return true;
};
const cleanPhone = raw => {
  if (!raw) return "";
  let tel = String(raw).replace(/[\s\-().]/g, "");

  if (tel.startsWith("00")) tel = tel.slice(2);
  if (tel.startsWith("0")) tel = "32" + tel.slice(1);
  return tel.replace(/[^\d]/g, "");
};
const isToday = iso => {
  if (!iso) return false;
  const d = new Date(iso);
  const t = new Date();
  return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
};
const isThisWeek = iso => {
  if (!iso) return false;

  const t = new Date();
  const diff = (t - d) / (1000 * 60 * 60 * 24);
  return diff >= 0 && diff < 7;
};

const normalizeEventInfo = event => {
  const input = event && typeof event === "object" && !Array.isArray(event) ? event : {};
  return {
    ...defaultData.event,
    ...input,
    affiche: input.affiche || input.flyer || input.poster || "",
    afficheWatermark: input.afficheWatermark || "",
    afficheNaam: input.afficheNaam || input.flyerNaam || input.posterNaam || "",
    reimbursementEmails: input.reimbursementEmails || input.terugbetalingEmails || defaultData.event.reimbursementEmails,
    finalReportEmails: input.finalReportEmails || input.eindrapportEmails || ""
  };
};

const createEventFromLegacyData = data => {
  const now = new Date().toISOString();
  const info = normalizeEventInfo(data && data.event);
  const id = info.id || data && data.activeEventId || `evt_${uid()}`;
  return {
    id,
    status: "active",
    createdAt: now,
    updatedAt: now,
    closedAt: "",
    archivedAt: "",
    info: {
      ...info,
      id
    }
  };
};

const normalizeLifecycleEvent = event => {
  if (!event || typeof event !== "object" || Array.isArray(event)) return null;
  const info = normalizeEventInfo(event.info || event.event || {});
  const id = event.id || info.id || `evt_${uid()}`;
  return {
    ...event,
    id,
    status: event.status || "active",
    createdAt: event.createdAt || "",
    updatedAt: event.updatedAt || "",
    closedAt: event.closedAt || "",
    archivedAt: event.archivedAt || "",
    info: {
      ...info,
      id: info.id || id
    }
  };
};

const getActiveEvent = data => {
  const events = Array.isArray(data && data.events) ? data.events : [];
  return events.find(event => event && event.id === data.activeEventId) || events.find(event => event && event.status === "active") || events.find(event => event && event.status !== "archived") || events[0] || null;
};

const getActiveEventInfo = data => {
  const activeEvent = getActiveEvent(data);
  return normalizeEventInfo(activeEvent && activeEvent.info || data && data.event);
};

const ensureActiveEvent = data => {
  const next = {
    ...data
  };
  let events = Array.isArray(next.events) ? next.events.map(normalizeLifecycleEvent).filter(Boolean) : [];
  let activeEvent = events.find(event => event.id === next.activeEventId);
  if (!activeEvent) activeEvent = events.find(event => event.status === "active") || events.find(event => event.status !== "archived") || events[0] || null;
  if (!activeEvent) {
    activeEvent = createEventFromLegacyData(next);
    events = [activeEvent];
  }
  next.activeEventId = activeEvent.id;
  next.events = events;
  return next;
};

const EVENT_MEDIA_FIELDS = ["affiche", "afficheWatermark", "afficheNaam"];

const protectEventMediaFields = (syncedInfo, activeInfo, mirrorInfo, options = {}) => {
  if (options.allowBlankEventMedia === true) return syncedInfo;
  const protectedInfo = {
    ...syncedInfo
  };
  EVENT_MEDIA_FIELDS.forEach(field => {
    if (!mirrorInfo[field] && activeInfo[field]) {
      protectedInfo[field] = activeInfo[field];
    }
  });
  return protectedInfo;
};

const ensureEventLifecycleStructure = (data, options = {}) => {
  const hadEvents = Array.isArray(data && data.events) && data.events.length > 0;
  const next = ensureActiveEvent(data || {});
  const activeIndex = next.events.findIndex(event => event.id === next.activeEventId);
  const activeEvent = next.events[activeIndex] || createEventFromLegacyData(next);
  const mirrorInfo = normalizeEventInfo(next.event);
  const activeInfo = normalizeEventInfo(activeEvent.info);
  const preferEventMirror = options.preferEventMirror !== false;
  const mergedInfo = preferEventMirror ? {
    ...activeInfo,
    ...mirrorInfo
  } : {
    ...mirrorInfo,
    ...activeInfo
  };
  const syncedInfo = protectEventMediaFields(mergedInfo, activeInfo, mirrorInfo, options);
  const id = syncedInfo.id || activeEvent.id || next.activeEventId || `evt_${uid()}`;
  const now = new Date().toISOString();
  const syncedEvent = {
    ...activeEvent,
    id,
    status: activeEvent.status || "active",
    createdAt: activeEvent.createdAt || now,
    updatedAt: activeEvent.updatedAt || now,
    closedAt: activeEvent.closedAt || "",
    archivedAt: activeEvent.archivedAt || "",
    info: {
      ...syncedInfo,
      id
    }
  };
  const events = [...next.events];
  if (activeIndex >= 0) {
    events[activeIndex] = syncedEvent;
  } else {
    events.push(syncedEvent);
  }
  return {
    ...next,
    event: syncedEvent.info,
    activeEventId: id,
    events,
    eventLifecycleMeta: {
      ...(next.eventLifecycleMeta && typeof next.eventLifecycleMeta === "object" && !Array.isArray(next.eventLifecycleMeta) ? next.eventLifecycleMeta : {}),
      version: EVENT_LIFECYCLE_VERSION,
      migratedFromSingleEvent: next.eventLifecycleMeta && next.eventLifecycleMeta.migratedFromSingleEvent === true || !hadEvents,
      migratedAt: next.eventLifecycleMeta && next.eventLifecycleMeta.migratedAt || (!hadEvents ? now : "")
    }
  };
};

const syncActiveEventMirror = data => ensureEventLifecycleStructure(data, {
  preferEventMirror: true
});

const updateEventMirror = (data, patch) => ensureEventLifecycleStructure({
  ...data,
  event: {
    ...normalizeEventInfo(data && data.event),
    ...(patch || {})
  }
}, {
  preferEventMirror: true,
  allowBlankEventMedia: EVENT_MEDIA_FIELDS.some(field => Object.prototype.hasOwnProperty.call(patch || {}, field))
});

const deepClone = value => value == null ? value : JSON.parse(JSON.stringify(value));

const buildCurrentEventSnapshot = data => {
  const synced = syncActiveEventMirror(data || {});
  const activeEvent = getActiveEvent(synced);
  const eventInfo = normalizeEventInfo(synced.event || activeEvent && activeEvent.info);
  const eventId = eventInfo.id || synced.activeEventId || activeEvent && activeEvent.id || `evt_${uid()}`;
  const createdAt = new Date().toISOString();
  const summary = berekenKosten(synced);
  const bc = synced.businessContinuity || defaultData.businessContinuity;
  const sheetSets = (bc.sheetSets || []).filter(set => set && set.eventId === eventId);
  const sheetSetIds = new Set(sheetSets.map(set => set.id).filter(Boolean));
  const sheets = (bc.sheets || []).filter(sheet => sheet && (sheet.eventId === eventId || sheetSetIds.has(sheet.sheetSetId)));
  const sheetIds = new Set(sheets.map(sheet => sheet.id).filter(Boolean));
  const belongsToCurrentEvent = item => {
    if (!item || typeof item !== "object") return false;
    if (item.eventId) return item.eventId === eventId;
    if (item.sheetSetId) return sheetSetIds.has(item.sheetSetId);
    if (item.sheetId) return sheetIds.has(item.sheetId);
    return true;
  };
  return {
    snapshotVersion: "1.0.0",
    createdAt,
    eventId,
    eventInfo: deepClone({
      ...eventInfo,
      id: eventId
    }),
    summary: deepClone(summary),
    takenState: deepClone(synced.taken || []),
    materiaalState: deepClone(synced.materiaal || []),
    winkelbestellingen: deepClone(synced.winkelbestellingen || {}),

    kostenbeheer: deepClone(synced.kostenbeheer || defaultData.kostenbeheer),
    voorverkoopStreefdoel: synced.voorverkoopStreefdoel || "",
    voorverkopen: deepClone(synced.voorverkopen || []),
    zelfinbreng: deepClone(synced.zelfinbreng || []),
    prijslijst: deepClone(synced.prijslijst || []),
    prijslijstCategorien: deepClone(synced.prijslijstCategorien || []),
    businessContinuity: {
      sheetSets: deepClone(sheetSets),
      sheets: deepClone(sheets),
      manualEntryBatches: deepClone((bc.manualEntryBatches || []).filter(belongsToCurrentEvent)),
      manualEntryLines: deepClone((bc.manualEntryLines || []).filter(belongsToCurrentEvent)),
      incidents: deepClone((bc.incidents || []).filter(belongsToCurrentEvent)),
      priceListChanges: deepClone((bc.priceListChanges || []).filter(belongsToCurrentEvent))
    },
    bulkGeschiedenis: deepClone(synced.bulkGeschiedenis || {}),
    skippedIssues: deepClone(synced.overgeslagenAandachtspunten || [])
  };
};

// Download Excel-template voor DatabaseContacten
const downloadGvTemplate = () => {
  const template = [{
    voornaam: "Johan",
    naam: "Janssens",
    gsm1: "+32475123456",
    taal: "nl",
    geslacht: "m"
  }, {
    voornaam: "Marie",
    naam: "Dupont",
    gsm1: "+32476234567",
    taal: "fr",
    geslacht: "f"
  }];
  const ws = XLSX.utils.json_to_sheet(template);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "DatabaseContacten");
  XLSX.writeFile(wb, "database_contacten_template.xlsx");
};

// Importeer DatabaseContacten uit Excel
const importGvContacten = (file, setData, t, showToast) => {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const wb = XLSX.read(ev.target.result, {
        type: "array"
      });
      const sheet = wb.Sheets["DatabaseContacten"] || wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet);
      if (!rows.length) {
        showToast(t.import_failed);
        return;
      }
      const contacten = rows.map(r => ({
        id: uid(),
        voornaam: (r.voornaam || r.Voornaam || r.prenom || r.Prénom || "").toString().trim(),
        naam: (r.naam || r.Naam || r.nom || r.Nom || "").toString().trim(),
        gsm1: (r.gsm1 || r.GSM || r.gsm || r.telefoon || r.tel || "").toString().trim(),
        taal: (r.taal || r.langue || r.lang || "nl").toString().toLowerCase().startsWith("fr") ? "fr" : "nl",
        geslacht: (r.geslacht || r.sexe || r.gender || "").toString().toLowerCase().startsWith("f") ? "f" : (r.geslacht || r.sexe || r.gender || "").toString().toLowerCase().startsWith("m") || (r.geslacht || r.sexe || r.gender || "").toString().toLowerCase().startsWith("h") ? "m" : ""
      })).filter(c => c.gsm1);
      setData(d => ({
        ...d,
        databaseContacten: contacten
      }));
      showToast(t.gv_contact_count(contacten.length, contacten.filter(c => c.taal === "nl").length, contacten.filter(c => c.taal === "fr").length));

      return false;

    const createdAt = new Date().toISOString();
    const correctionId = uid();
    setData(d => {

const resizeVolunteerPhoto = file => new Promise((resolve, reject) => {
  if (!file || !/^image\/(jpeg|png|webp)$/.test(file.type || "")) {
    reject(new Error("unsupported"));
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => reject(new Error("read"));
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("image"));
    img.onload = () => {
      const size = Math.min(img.width, img.height);
      const sx = Math.max(0, (img.width - size) / 2);
      const sy = Math.max(0, (img.height - size) / 2);
      const canvas = document.createElement("canvas");
      canvas.width = 300;
      canvas.height = 300;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, sx, sy, size, size, 0, 0, 300, 300);
      resolve(canvas.toDataURL("image/jpeg", 0.82));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

const resizeEventFlyer = file => new Promise((resolve, reject) => {
  if (!file || !/^image\/(jpeg|png|webp)$/.test(file.type || "")) {
    reject(new Error("unsupported"));
    return;
  }
  const reader = new FileReader();
  reader.onerror = () => reject(new Error("read"));
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error("image"));
    img.onload = () => {
      const maxW = 1200;
      const maxH = 1600;
      const scale = Math.min(1, maxW / img.width, maxH / img.height);
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const image = canvas.toDataURL("image/jpeg", 0.86);
      const wm = document.createElement("canvas");
      wm.width = w;
      wm.height = h;
      const wmCtx = wm.getContext("2d");
      wmCtx.fillStyle = "#ffffff";
      wmCtx.fillRect(0, 0, w, h);
      wmCtx.globalAlpha = 0.16;
      wmCtx.drawImage(img, 0, 0, w, h);
      wmCtx.globalAlpha = 1;
      const watermark = wm.toDataURL("image/jpeg", 0.7);
      resolve({
        image,
        watermark,
        name: file.name || ""
      });
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});

const applyEventFlyerWatermark = (doc, event, pageW, pageH) => {
  const src = event && (event.afficheWatermark || event.affiche);
  if (!doc || !src) return;
  try {
    const props = doc.getImageProperties(src);
    const maxW = pageW * 0.82;
    const maxH = pageH * 0.82;
    let w = maxW;
    let h = props.height / props.width * w;
    if (h > maxH) {
      h = maxH;
      w = props.width / props.height * h;
    }
    const x = (pageW - w) / 2;
    const y = (pageH - h) / 2;
    doc.addImage(src, "JPEG", x, y, w, h);
  } catch (e) {/* watermerk overslaan bij onleesbare afbeelding */}
};

// Converteert tijdstring "HH:MM" naar minuten
const toMinutes = s => {
  if (!s) return null;
  const [h, m] = s.split(":").map(Number);
  return h * 60 + m;
};

// Geeft het tijdslot van een taak/subtaak als [start, eind] in minuten
const getSlot = unit => {
  const s = toMinutes(unit.start);
  const e = toMinutes(unit.eind);
  if (s === null || e === null || s >= e) return null;
  return [s, e];
};

// Controleert of twee slots overlappen
const slotsOverlap = (a, b) => a[0] < b[1] && b[0] < a[1];

// Foto inladen + comprimeren tot een kleine JPEG-dataURL (localStorage-vriendelijk)
function comprimeerAfbeelding(file, maxZijde, kwaliteit) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let {
          width,
          height
        } = img;
        if (width > height && width > maxZijde) {
          height = Math.round(height * (maxZijde / width));
          width = maxZijde;
        } else if (height > maxZijde) {
          width = Math.round(width * (maxZijde / height));
          height = maxZijde;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", kwaliteit));
      };
      img.onerror = () => reject(new Error("beeld"));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error("lezen"));
    reader.readAsDataURL(file);
  });
}

    // --- RECHTS: Budget vs uitgaven ---
    const rx = marge + kolW + 5;

    let ry = blokTop + 8;

    doc.setDrawColor(LIJN[0], LIJN[1], LIJN[2]);
    doc.setLineWidth(0.3);
    doc.line(rx + 6, ry - 2, rx + kolW - 6, ry - 2);

    regelRechts(t.kb_totaal_beschikbaar, k.totaleInkomsten, true);

    const beschikbaar = k.totaleInkomsten;

    } else {

    // ===================== UITGAVENDETAILS (volle breedte, doorlopend) =====================
    const uitItems = [];

    });

    }));
    (kb.manueleKosten || []).forEach(mk => {

      });

    sectieKop(t.pdf_uitgavendetails, k.totaalUitgegeven, ORANJE, [255, 244, 224], ORANJE);
    if (uitItems.length === 0) {
      nieuwePagina(8);
      doc.setTextColor(GRIJS[0], GRIJS[1], GRIJS[2]);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8.5);
      doc.text(t.kb_winkel_geen, marge + 6, y + 2);

    } else {
      uitItems.forEach(it => {
        nieuwePagina(8);
        cirkel(marge + 8, y - 1, 3.5, it.kleur);
        doc.setFillColor(255, 255, 255);

        doc.setFont("helvetica", "normal");

        doc.text(kort(it.label, pageW - 2 * marge - 50, 9), marge + 15, y);
        doc.setTextColor(ROOD[0], ROOD[1], ROOD[2]);

        doc.text(fmtEuro(it.bedrag), pageW - marge - 6, y, {

        });

        doc.setDrawColor(LIJN[0], LIJN[1], LIJN[2]);
        doc.setLineWidth(0.2);
        doc.line(marge + 15, y - 2.5, pageW - marge - 6, y - 2.5);
      });
    }
    y += 4;

    // ===================== ZELFINBRENG (volle breedte, doorlopend) =====================
    const ziLijst = data.zelfinbreng || [];
    if (ziLijst.length > 0) {
      sectieKop(t.zi_titel, k.zelfinbrengTotaal, BLAUW, [225, 235, 248], BLAUW);
      ziLijst.slice().sort((a, b) => (a.datum || "").localeCompare(b.datum || "")).forEach(zi => {
        nieuwePagina(7);
        cirkel(marge + 8, y - 1, 2, BLAUW);
        doc.setTextColor(GRIJS[0], GRIJS[1], GRIJS[2]);
        doc.setFont("helvetica", "normal");
        doc.setFontSize(8);
        doc.text(datumKort(zi.datum), marge + 14, y);
        doc.setTextColor(DONKER[0], DONKER[1], DONKER[2]);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(8.5);
        doc.text(kort(persoonNaam(zi.persoonId, zi.persoonVrij), 90, 8.5), marge + 38, y);
        doc.setTextColor(BLAUW[0], BLAUW[1], BLAUW[2]);
        doc.text(fmtEuro(parseBedragNum(zi.bedrag)), pageW - marge - 6, y, {
          align: "right"
        });
        y += 6;
      });
      y += 4;
    }

    // ===================== KAS (volle breedte) =====================
    const heeftCashIn = k.kasIn > 0,
      heeftCashUit = k.kasUitTotaal > 0;
    const heeftKas = k.kasStart > 0 || heeftCashIn || heeftCashUit;
    if (heeftKas) {
      let kasRegels = 1;
      if (heeftCashIn) kasRegels++;
      if (heeftCashUit) kasRegels++;
      const kasH = 16 + kasRegels * 8 + 10;
      nieuwePagina(kasH + 4);
      const kasTop = y;
      doc.setFillColor(DONKERBLAUW[0], DONKERBLAUW[1], DONKERBLAUW[2]);
      doc.roundedRect(marge, kasTop, pageW - 2 * marge, kasH, 2.5, 2.5, "F");
      let ky = kasTop + 9;
      cirkel(marge + 9, ky - 1, 4, GROEN);
      doc.setTextColor(255, 255, 255);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.text(t.kas_titel.toUpperCase(), marge + 16, ky + 0.5);
      ky += 12;
      const kasRegel = (label, waarde, teken, kleurRGB) => {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(9.5);
        doc.setTextColor(255, 255, 255);
        doc.text(label, marge + 6, ky);
        doc.setTextColor(kleurRGB[0], kleurRGB[1], kleurRGB[2]);
        doc.setFont("helvetica", "bold");
        doc.text(`${teken || ""}${fmtEuro(waarde)}`, pageW - marge - 6, ky, {
          align: "right"
        });
        ky += 8;
      };
      kasRegel(t.kas_start, k.kasStart, "", GROENLICHT);
      if (heeftCashIn) kasRegel(t.kas_cash_in, k.kasIn, "+ ", GROENLICHT);
      if (heeftCashUit) kasRegel(t.kas_cash_uit, k.kasUitTotaal, "- ", ROODLICHT);
      doc.setDrawColor(80, 100, 120);
      doc.setLineWidth(0.3);
      doc.line(marge + 6, ky - 3, pageW - marge - 6, ky - 3);
      ky += 1;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9.5);
      doc.setTextColor(255, 255, 255);
      doc.text(t.kas_eindsaldo, marge + 6, ky + 1);
      doc.setTextColor(k.kasEind < 0 ? ROODLICHT[0] : GROENLICHT[0], k.kasEind < 0 ? ROODLICHT[1] : GROENLICHT[1], k.kasEind < 0 ? ROODLICHT[2] : GROENLICHT[2]);
      doc.text(fmtEuro(k.kasEind), pageW - marge - 6, ky + 1, {
        align: "right"
      });
      y = kasTop + kasH + 6;
    }
    doc.setTextColor(DONKER[0], DONKER[1], DONKER[2]);

    // Paginanummers
    const totaalPaginas = doc.internal.getNumberOfPages();
    for (let p = 1; p <= totaalPaginas; p++) {
      doc.setPage(p);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(7.5);
      doc.setTextColor(GRIJS[0], GRIJS[1], GRIJS[2]);
      doc.text(`${p} / ${totaalPaginas}`, pageW - marge, pageH - 5, {
        align: "right"
      });
    }
    return doc;
  };
  const downloadPDF = () => {
    setBezig(true);
    try {
      const doc = genereerPDF();
      if (!doc) return;
      const naam = `kostenbeheer_${(data.event.naam || "evenement").replace(/[^a-z0-9]/gi, "_")}.pdf`;
      doc.save(naam);
      showToast(t.kb_pdf_klaar);
    } finally {
      setBezig(false);
    }
  };
  const genereerEindrapportPDF = () => {
    const jsPDFns = window.jspdf;
    if (!jsPDFns || !jsPDFns.jsPDF) {
      alert(t.kb_pdf_fout);
      return null;
    }
    const doc = new jsPDFns.jsPDF({
      unit: "mm",
      format: "a4"
    });
    const pageW = 210,
      pageH = 297,
      marge = 14;
    const ROOD = [211, 62, 62],
      GROEN = [58, 125, 68],
      DONKER = [26, 22, 18],
      GRIJS = [110, 105, 96],
      LIJN = [226, 215, 199],
      ZACHT = [249, 245, 238];
    let y = marge;
    const ensure = nodig => {
      if (y + nodig > pageH - marge) {
        doc.addPage();
        y = marge;
      }
    };
    const money = cents => fmtCents(cents);
    const sectionTitle = title => {
      ensure(12);
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.setTextColor(DONKER[0], DONKER[1], DONKER[2]);
      doc.text(title, marge, y);
      y += 3;
      doc.setDrawColor(ROOD[0], ROOD[1], ROOD[2]);
      doc.setLineWidth(0.5);
      doc.line(marge, y, pageW - marge, y);
      y += 6;
    };
    const row = (label, value, opts = {}) => {
      ensure(8);
      doc.setFont("helvetica", opts.strong ? "bold" : "normal");
      doc.setFontSize(opts.strong ? 10.5 : 9.5);
      const color = opts.color === "green" ? GROEN : opts.color === "red" ? ROOD : DONKER;
      doc.setTextColor(color[0], color[1], color[2]);
      doc.text(String(label || ""), marge, y);
      doc.text(String(value || ""), pageW - marge, y, {
        align: "right"
      });
      y += opts.strong ? 7 : 6;
      if (opts.line) {
        doc.setDrawColor(LIJN[0], LIJN[1], LIJN[2]);
        doc.setLineWidth(0.25);
        doc.line(marge, y - 3.5, pageW - marge, y - 3.5);
      }
    };
    const cardBlock = (title, rows, opts = {}) => {
      const rowHeight = 6;
      const x = marge;
      const w = pageW - marge * 2;
      const noteLines = opts.note ? doc.splitTextToSize(opts.note, w - 14) : [];
      const noteHeight = noteLines.length ? noteLines.length * 4 + 3 : 0;
      const h = 12 + rows.length * rowHeight + noteHeight + 4;
      ensure(h + 4);
      const top = y;
      const accent = opts.accent || ROOD;
      const fitText = (value, maxWidth) => {
        let text = String(value || "");
        if (doc.getTextWidth(text) <= maxWidth) return text;
        while (text.length > 1 && doc.getTextWidth(text + "...") > maxWidth) text = text.slice(0, -1);
        return `${text}...`;
      };
      doc.setFillColor(255, 252, 247);
      doc.setDrawColor(LIJN[0], LIJN[1], LIJN[2]);
      doc.roundedRect(x, top, w, h, 2.6, 2.6, "FD");
      doc.setFillColor(accent[0], accent[1], accent[2]);
      doc.roundedRect(x, top, 3, h, 2.6, 2.6, "F");
      doc.setFont("helvetica", "bold");
      doc.setFontSize(11.5);
      doc.setTextColor(DONKER[0], DONKER[1], DONKER[2]);
      doc.text(title, x + 7, top + 8);
      let yy = top + 16;
      rows.forEach(item => {
        const color = item.color === "green" ? GROEN : item.color === "red" ? ROOD : DONKER;
        doc.setFont("helvetica", item.strong ? "bold" : "normal");
        doc.setFontSize(item.strong ? 10.3 : 9.3);
        doc.setTextColor(color[0], color[1], color[2]);
        if (item.line) {
          doc.setDrawColor(LIJN[0], LIJN[1], LIJN[2]);
          doc.setLineWidth(0.25);
          doc.line(x + 7, yy - 4, x + w - 7, yy - 4);
        }
        doc.text(fitText(item.label, w - 58), x + 7, yy);
        doc.text(String(item.value || ""), x + w - 7, yy, {
          align: "right"
        });
        yy += rowHeight;
      });
      if (opts.note) {
        doc.setFont("helvetica", "italic");
        doc.setFontSize(8.1);
        doc.setTextColor(GRIJS[0], GRIJS[1], GRIJS[2]);
        doc.text(noteLines, x + 7, yy + 1);
      }
      y = top + h + 6;
    };
    const shade = (rgb, amount) => rgb.map(v => Math.max(0, Math.min(255, Math.round(v + amount))));
    const addResultIcon = (x, yy, size) => {
      const selector = eind.resultCents < 0 ? ".report-result-icon-negative" : ".report-result-icon-positive";
      const icon = document.querySelector(selector);
      if (!icon || !icon.complete) return;
      try {
        doc.addImage(icon, "PNG", x, yy, size, size);
      } catch (e) {/* resultaaticoon overslaan als jsPDF het niet kan verwerken */}
    };
    const drawSlice = (cx, cy, r, startDeg, endDeg, rgb) => {
      const steps = Math.max(8, Math.ceil(Math.abs(endDeg - startDeg) / 5));
      for (let s = 0; s < steps; s++) {
        const a1 = (startDeg + (endDeg - startDeg) * (s / steps)) * Math.PI / 180;
        const a2 = (startDeg + (endDeg - startDeg) * ((s + 1) / steps)) * Math.PI / 180;
        doc.triangle(cx, cy, cx + r * Math.cos(a1), cy + r * Math.sin(a1) * 0.68, cx + r * Math.cos(a2), cy + r * Math.sin(a2) * 0.68, "F");
      }
    };
    const drawExplodedPie = (cx, cy, r, items) => {
      const totaal = items.reduce((acc, item) => acc + Math.max(0, item.bedrag), 0);
      if (!totaal) return false;
      let hoek = -95;
      items.forEach((item, index) => {
        const deel = item.bedrag / totaal;
        const eindHoek = hoek + deel * 360;
        const midden = (hoek + eindHoek) / 2 * Math.PI / 180;
        const offset = 3 + Math.min(4, deel * 8);
        const sx = cx + Math.cos(midden) * offset;
        const sy = cy + Math.sin(midden) * offset * 0.68;
        const rgb = hexNaarRgb(item.kleur);
        doc.setFillColor(...shade(rgb, -58));
        drawSlice(sx + 1.3, sy + 4.2, r, hoek, eindHoek, shade(rgb, -58));
        doc.setFillColor(...shade(rgb, -28));
        drawSlice(sx + 0.7, sy + 2.2, r, hoek, eindHoek, shade(rgb, -28));
        doc.setFillColor(rgb[0], rgb[1], rgb[2]);
        drawSlice(sx, sy, r, hoek, eindHoek, rgb);
        doc.setDrawColor(255, 255, 255);
        doc.setLineWidth(0.35);
        doc.line(sx, sy, sx + r * Math.cos(hoek * Math.PI / 180), sy + r * Math.sin(hoek * Math.PI / 180) * 0.68);
        hoek = eindHoek;
      });
      doc.setFillColor(255, 255, 255);
      doc.circle(cx, cy, r * 0.28, "F");
      doc.setFont("helvetica", "bold");

// Export JSON knop
function exportToJson() {
  const data = localStorage.getItem('evenement_beheer_data_v4');
  if (!data) {
    alert('Geen data gevonden!');
    return;
  }
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'evenement_beheer_export_' + new Date().toISOString().split('T')[0] + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
